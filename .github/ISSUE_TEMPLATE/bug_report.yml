name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `/command ...`
        2. ...
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Affected component
      description: e.g. gateway, rcon-client, log-tailer, installer
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: cod2admin version (`/help` shows it), or the installer archive filename
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
    validations:
      required: false
