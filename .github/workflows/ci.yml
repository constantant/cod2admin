name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # admin-store/ban-store run integration tests against a real Postgres (docs/PLAN.md §11.2/
    # §11.4) - no CoD2 image or real Telegram token needed, just this service container.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cod2admin
          POSTGRES_PASSWORD: cod2admin
          POSTGRES_DB: cod2admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://cod2admin:cod2admin@localhost:5432/cod2admin_test
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      - uses: pnpm/action-setup@v4

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Conventional Commits are required for nx release's automatic version/changelog
      # inference (nx.json release.version.conventionalCommits) - the local commit-msg
      # hook (.husky/commit-msg) can be bypassed with --no-verify, so also gate it in CI.
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
        if: github.event_name == 'pull_request'

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - run: pnpm exec nx record -- pnpm exec nx format:check --base="remotes/origin/main"
      - run: pnpm exec nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always()
